name: Sincronizar conquistas da Steam

on:
  workflow_dispatch:
  schedule:
    # Minutos fora do início de cada hora reduzem disputas por agendamento.
    - cron: '3-59/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-steam.yml'
      - 'steam_progress.py'
      - 'stats_probe.py'
      - 'dlc_progress.py'
      - 'refresh-request.txt'

# Evita corrida entre execuções que gravam achievements.json.
concurrency:
  group: steam-platina-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar conquistas
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python steam_progress.py
      - name: Testar contadores parciais da Steam
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python stats_probe.py
      - name: Conferir todas as conquistas DLC
        run: python dlc_progress.py
      - name: Publicar progresso
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add achievements.json stats_probe.json dlc_progress.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração"
            exit 0
          fi
          git commit -m "Atualizar conquistas da Steam"
          git push
