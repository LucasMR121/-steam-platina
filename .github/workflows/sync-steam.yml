name: Sincronizar conquistas da Steam

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar conquistas
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python steam_progress.py
      - name: Publicar progresso
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add achievements.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração"
            exit 0
          fi
          git commit -m "Atualizar conquistas da Steam"
          git push
